name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: iyftv-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk iyftv.apk
          # The commit message becomes the "what's new" text in the app's update prompt.
          { git log -1 --format=%B; echo; echo "Built from ${{ github.sha }}. Install: https://github.com/${{ github.repository }}/releases/latest/download/iyftv.apk"; } > notes.txt
          gh release create "build-${{ github.run_number }}" iyftv.apk \
            --target "${{ github.sha }}" --latest \
            --title "iyfTV build ${{ github.run_number }}" \
            --notes-file notes.txt

  probe-site:
    # Captures what iyf.tv actually returns so the client can be checked against it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe iyf.tv
        run: python3 tools/probe_site.py probe-out
      - name: Follow a title from search to its video segments
        run: python3 tools/probe_play.py "沉默的证人" || true
      - name: Scores and list filters the site offers
        run: python3 tools/probe_filters.py || true
      - name: Run the app's site client against iyf.tv
        run: |
          status=0; IYF_LIVE=1 ./gradlew testDebugUnitTest --tests '*LiveSiteTest*' -q || status=$?
          python3 -c "import glob,re;[print(re.sub(r'(?s).*<system-out><!\\[CDATA\\[(.*?)\\]\\]>.*', r'\\1', open(f).read())) for f in glob.glob('app/build/test-results/testDebugUnitTest/*LiveSite*.xml')]"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-probe
          path: probe-out/

  device-tests:
    # Runs the tests on an Android emulator, against the live site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: adb logcat -G 16M; ./gradlew connectedDebugAndroidTest; s=$?; adb logcat -d -s WebPlayerDiag:I | tail -150; adb logcat -d -s StreamTrace:I PlayerKeys:I | head -400; [ $s = 0 ] && tools/release_smoke.sh; s2=$?; [ $s != 0 ] && exit $s; exit $s2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report
          path: app/build/reports/androidTests/
