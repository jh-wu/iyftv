name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: iyftv-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  probe-site:
    # Captures what iyf.tv actually returns so the client can be checked against it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Probe iyf.tv
        run: python3 tools/probe_site.py probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-probe
          path: probe-out/
